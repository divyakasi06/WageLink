<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WageLink &mdash; Confirm Job Completion</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; background: #f4f6f8; }
        h1 { color: #1a3c6e; }
        p.note { background: #eef2f8; padding: 10px 15px; border-radius: 6px; font-size: 14px; color: #444; }
        input, select { display: block; width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        button { background: #1a3c6e; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        #result { margin-top: 15px; font-weight: bold; }
        a { color: #1a3c6e; }
        .applicant-box { background: white; padding: 15px; border-radius: 8px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>WageLink &mdash; Confirm Job Completion</h1>
    <p class="note">Only employers should fill this in &mdash; this confirms a job was actually done and paid, and is what builds the worker's verified wage history.</p>

    <input type="number" id="jobId" placeholder="Enter Job ID" required>
    <button onclick="loadApplicants()">Show Applicants</button>

    <div class="applicant-box" id="applicantBox" style="display:none;">
        <label for="workerSelect"><b>Select the worker who did the job:</b></label>
        <select id="workerSelect"></select>

        <form id="confirmForm">
            <input type="number" id="amountPaid" placeholder="Amount Paid (&#8377;)" required>
            <input type="date" id="completedDate" required>
            <button type="submit">Confirm & Log Payment</button>
        </form>
    </div>

    <div id="result"></div>
    <p><a href="/postJob.html">Post a Job</a> | <a href="/employer.html">Register as Employer</a> | <a href="/home.html">Back to Home</a></p>

    <script>
        let currentJobId = null;

        async function loadApplicants() {
            currentJobId = document.getElementById("jobId").value;
            const response = await fetch(`/api/jobApplicants?jobId=${currentJobId}`);
            const applicants = await response.json();
            const select = document.getElementById("workerSelect");
            const box = document.getElementById("applicantBox");

            if (applicants.length === 0) {
                select.innerHTML = "";
                box.style.display = "none";
                document.getElementById("result").innerText = "No applicants for this job yet.";
                return;
            }

            select.innerHTML = applicants.map(a => `<option value="${a.workerId}">${a.name} (${a.skill}) &mdash; Worker ID: ${a.workerId}</option>`).join("");
            box.style.display = "block";
            document.getElementById("result").innerText = "";
        }

        document.getElementById("confirmForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const workerId = document.getElementById("workerSelect").value;
            const amountPaid = document.getElementById("amountPaid").value;
            const completedDate = document.getElementById("completedDate").value;

            const body = `workerId=${workerId}&jobId=${currentJobId}&amountPaid=${amountPaid}&completedDate=${completedDate}`;

            const response = await fetch("/api/confirmJob", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: body
            });
            const data = await response.json();
            document.getElementById("result").innerText = data.status === "success" ? "Payment confirmed and logged!" : "Something went wrong.";
        });
    </script>
</body>
</html>
